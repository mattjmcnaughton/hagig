name: Python backend

# Portable backend checks with the locked environment. Same commands as
# `just gate-expensive` in backend/, without requiring just on the runner.
on:
  push:
    branches: [main, python-backend, 'py/**']
    paths: ['backend/**', '.github/workflows/python-backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/python-backend.yml']

permissions:
  contents: read

jobs:
  check:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.9'
          enable-cache: false
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Record environment
        run: |
          uname -a
          uv --version
          uv run --frozen python -c 'import platform, sys; print(sys.version); print(platform.platform(), platform.machine())'
          git rev-parse HEAD
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ty check
      - run: uv run --frozen pytest -v -ra
