name: macOS build and presentation tests

on:
  pull_request:
    paths: ['clients/macos/**', 'backend/**', '.github/workflows/macos-*.yml']
  push:
    branches: [main]
    paths: ['clients/macos/**', 'backend/**', '.github/workflows/macos-*.yml']

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-15
    # SwiftNIO and BoringSSL (AsyncHTTPClient, #46) compile from source.
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        working-directory: clients/macos
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record native toolchain
        run: |
          mkdir -p captures
          { sw_vers; uname -m; xcodebuild -version; swift --version; git rev-parse HEAD; } > captures/environment.txt
          cat captures/environment.txt
      - name: Require the committed package pins
        run: |
          swift package resolve
          git diff --exit-code -- Package.resolved
      - run: swift build
      - run: swift test
      - name: Render minimal native proof
        run: |
          swift run --skip-build HagigScreenshots proof captures
          test "$(find captures -name '*.png' | wc -l | tr -d ' ')" = 2
          for image in captures/ready-{light,dark}.png; do sips -g pixelWidth -g pixelHeight "$image"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-proof-${{ github.sha }}
          path: |
            clients/macos/captures/ready-light.png
            clients/macos/captures/ready-dark.png
            clients/macos/captures/environment.txt
          if-no-files-found: error
          retention-days: 3
      - name: Render bounded representative states
        run: |
          swift run --skip-build HagigScreenshots states state-captures
          test "$(find state-captures -name '*.png' | wc -l | tr -d ' ')" = 34
          for image in state-captures/*.png; do sips -g pixelWidth -g pixelHeight "$image"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-states-${{ github.sha }}
          path: clients/macos/state-captures/*.png
          if-no-files-found: error
          retention-days: 3

  # #48: build Hagig.app with the uv-managed interpreter and the frozen backend
  # environment, move it outside the checkout, hide uv's interpreters and cache,
  # then run the relocation smoke, its counterfactuals and the app against the
  # bundled server. No model is installed: requests must answer model_missing.
  bundle-smoke:
    runs-on: macos-15
    # A release HagigShell build plus a debug test build of SwiftNIO/BoringSSL.
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      UV_PYTHON_PREFERENCE: only-managed
    defaults:
      run:
        shell: bash  # -eo pipefail, so a failure before `| tee` fails the step
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.9'
          enable-cache: false
      - name: Private uv directories and evidence location
        run: |
          {
            echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/uv-python"
            echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache"
            echo "EVIDENCE=$RUNNER_TEMP/bundle-evidence"
            echo "RELOCATED=$RUNNER_TEMP/relocated app/Hagig.app"
          } >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/bundle-evidence"
      - name: Record native bundle toolchain and tested revision
        run: |
          { sw_vers; uname -m; xcodebuild -version; swift --version; uv --version; git rev-parse HEAD; } | tee "$EVIDENCE/environment.txt"
      - name: Script contracts (tool stand-ins, not native proof)
        run: python3 clients/macos/test_bundle.py
      - name: Build the bundle (uv sync is the only network step)
        run: bash clients/macos/bundle.sh build 2>&1 | tee "$EVIDENCE/build.log"
      - name: Relocate outside the checkout and hide uv's interpreters and cache
        run: |
          mkdir "$(dirname "$RELOCATED")"
          mv clients/macos/.build/Hagig.app "$RELOCATED"
          mv "$UV_PYTHON_INSTALL_DIR" "$UV_PYTHON_INSTALL_DIR.hidden"
          mv "$UV_CACHE_DIR" "$UV_CACHE_DIR.hidden"
          test ! -e clients/macos/.build/Hagig.app
      - name: Relocation smoke (signatures, loader paths, status, model_missing, Seatbelt, stop)
        timeout-minutes: 5
        run: bash clients/macos/smoke-bundle.sh "$RELOCATED" 2>&1 | tee "$EVIDENCE/smoke.log"
      - name: App against the bundled server through Contents/Helpers/hagig
        working-directory: clients/macos
        timeout-minutes: 25
        run: |
          HAGIG_BUNDLED_APP="$RELOCATED" HAGIG_INTEGRATION_WAV="$GITHUB_WORKSPACE/backend/tests/fixtures/speech.wav" \
            swift test --filter BundledBackendTests 2>&1 | tee "$EVIDENCE/integration.log"
          grep -E 'Executed 2 tests, with 0 failures' "$EVIDENCE/integration.log"
          if grep -E 'skipped|Skipped' "$EVIDENCE/integration.log"; then exit 1; fi
          test "$(grep -c BUNDLED_BACKEND_CLEANUP_COMPLETE "$EVIDENCE/integration.log")" = 2
      - name: Counterfactual - the app test fails against a bundle without the backend package
        working-directory: clients/macos
        timeout-minutes: 10
        run: |
          broken="$RUNNER_TEMP/broken app/Hagig.app"
          mkdir "$(dirname "$broken")"
          cp -R "$RELOCATED" "$broken"
          rm -rf "$broken"/Contents/Resources/python/lib/python3.*/site-packages/hagig
          if HAGIG_BUNDLED_APP="$broken" HAGIG_INTEGRATION_WAV="$GITHUB_WORKSPACE/backend/tests/fixtures/speech.wav" \
              swift test --skip-build --filter BundledBackendTests/testRecordingReachesTheBundledServerAndShowsModelMissing \
              > "$EVIDENCE/integration-counterfactual.log" 2>&1; then
            echo 'The app test passed without a bundled backend' >&2
            exit 1
          fi
          grep -F 'serverUnavailable' "$EVIDENCE/integration-counterfactual.log"
          rm -rf "$(dirname "$broken")"
      - name: Smoke counterfactuals (checkout link, missing profile, unsigned extension)
        timeout-minutes: 10
        run: bash clients/macos/bundle-proof.sh "$RELOCATED" "$EVIDENCE/proof"
      - name: Upload bounded text evidence (no bundle bytes)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/bundle-evidence/
          if-no-files-found: warn
          retention-days: 3

  editor-semantics:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        working-directory: clients/macos
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Falsify native editor semantics in disposable worktree
        timeout-minutes: 15
        run: bash semantic-proof.sh "$RUNNER_TEMP/editor-semantic-proof"
      - name: Read native capability preflight (not interaction acceptance)
        timeout-minutes: 1
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/editor-semantic-proof/capabilities.txt"
          printf 'preflight_status=unavailable\n' > "$metadata"
          values=$(mktemp "$RUNNER_TEMP/editor-capability-values.XXXXXX")
          trap 'rm -f "$values"' EXIT
          # Read-only APIs: never request access, post events or record.
          # A Swift compile/runtime failure leaves unavailable, not false.
          # Permissions describe this Swift probe, not HagigShell's identity.
          swift - > "$values" <<'SWIFT'
          import ApplicationServices
          import CoreGraphics
          print("ax_trusted=\(AXIsProcessTrusted())")
          print("event_posting_allowed=\(CGPreflightPostEventAccess())")
          print("screen_capture_allowed=\(CGPreflightScreenCaptureAccess())")
          SWIFT
          if command -v screencapture > /dev/null 2>&1; then
            printf 'screencapture_available=true\n' >> "$values"
          else
            printf 'screencapture_available=false\n' >> "$values"
          fi
          printf 'preflight_status=available\n' >> "$values"
          mv "$values" "$metadata"
      - name: Upload native semantic proof transcripts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-editor-semantics-${{ github.sha }}
          path: ${{ runner.temp }}/editor-semantic-proof/
          if-no-files-found: warn
          retention-days: 3

  client-semantics:
    runs-on: macos-15
    # Seventeen candidate/mutant/restored experiments, each two incremental rebuilds.
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Falsify asset-free client semantics in disposable worktree
        run: bash clients/macos/client-proof.sh "$RUNNER_TEMP/issue21-client-proof"
      - name: Upload bounded client semantic proof transcripts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-client-semantics-${{ github.sha }}
          path: ${{ runner.temp }}/issue21-client-proof/
          if-no-files-found: warn
          retention-days: 3

  shell-interaction:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        working-directory: clients/macos
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise native editor, focus, cancellation and recovery
        timeout-minutes: 15
        run: bash interaction-probe/run.sh
      - name: Upload fixed synthetic metadata and cleanup-gated app-only movie
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-shell-interaction-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hagig-xcui-probe/evidence/*.txt
            ${{ runner.temp }}/hagig-xcui-probe/evidence/interaction.mov
          if-no-files-found: error
          retention-days: 3
