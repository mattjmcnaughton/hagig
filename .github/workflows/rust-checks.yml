name: Rust checks

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/rust-checks.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/rust-checks.yml'

permissions:
  contents: read

jobs:
  check:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
          - os: macos-15
            host: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned Rust and assert native host
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          rustup show
          rustc --version --verbose
          cargo --version
          rustc --version --verbose | grep -Fx "host: $EXPECTED_HOST"
      # Same commands as backend/justfile; no third-party tool installers.
      - name: Build
        run: cargo build --locked --all-targets
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: |
          cargo test --locked --all-targets
          cargo test --locked --doc
