name: Rust checks

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/rust-checks.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/rust-checks.yml'

permissions:
  contents: read

jobs:
  check:
    name: Rust (${{ matrix.os }}; ${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Capable-host enforcement evidence, NOT a product support ceiling.
          # 22.04 retires 2027-04-17; replace this evidence host before brownouts.
          - os: ubuntu-22.04
            host: x86_64-unknown-linux-gnu
            suite: enforcement
          - os: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
            suite: disabled-and-refusal
          - os: macos-15
            host: aarch64-apple-darwin
            suite: portable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned Rust and assert native host
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          rustup show
          rustc --version --verbose
          cargo --version
          rustc --version --verbose | grep -Fx "host: $EXPECTED_HOST"
      # Same commands as backend/justfile; no third-party tool installers.
      - name: Build
        run: cargo build --locked --all-targets
      - name: Format
        run: |
          cargo fmt --all -- --check
          rustfmt --edition 2024 --check tests/fixtures/linux_worker.rs tests/fixtures/inference_peer.rs
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: |
          if test "$TEST_SUITE" = disabled-and-refusal; then
            # These are explicit product-mode checks, NOT enforcement proof.
            cargo test --locked --test worker_boundary
            cargo test --locked --test server_admission -- --nocapture
            cargo test --locked --test configuration
            cargo test --locked --test model_install
            cargo test --locked --test wav_input
            cargo test --locked --test real_service
            cargo test --locked --test linux_isolation disabled_worker_hygiene_and_failure_contract -- --exact --nocapture
            cargo test --locked --test linux_isolation required_mode_reports_enforcement_or_refusal -- --exact --nocapture
            cargo test --locked --test linux_isolation unmapped_user_namespace_fails_closed -- --exact --nocapture
          else
            cargo test --locked --all-targets -- --nocapture
          fi
          cargo test --locked --doc
      - name: Linux namespace diagnostics (read-only)
        if: ${{ always() && runner.os == 'Linux' }}
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: |
          uname -srmo
          printf 'Runner image: %s %s\n' "${ImageOS:-unavailable}" "${ImageVersion:-unavailable}"
          for setting in \
            /proc/sys/user/max_user_namespaces \
            /proc/sys/user/max_net_namespaces \
            /proc/sys/kernel/unprivileged_userns_clone \
            /proc/sys/kernel/apparmor_restrict_unprivileged_userns; do
            if value=$(cat "$setting" 2>/dev/null); then
              printf '%s=%s\n' "$setting" "$value"
            else
              printf '%s=unavailable\n' "$setting"
            fi
          done
          if profile=$(cat /proc/self/attr/current 2>/dev/null); then
            printf 'Current security profile: %s\n' "$profile"
          else
            printf 'Current security profile: unavailable\n'
          fi
          unshare --version || printf 'unshare version unavailable (status=%s)\n' "$?"
          user_status=0
          unshare --user /usr/bin/true || user_status=$?
          printf 'user namespace probe status=%s\n' "$user_status"
          network_status=0
          unshare --user --map-root-user --net /usr/bin/true || network_status=$?
          printf 'user+network namespace/map probe status=%s\n' "$network_status"
          if test "$TEST_SUITE" = disabled-and-refusal; then
            # Assert observed restricted-host prerequisite; never label refusal enforcement.
            test "$user_status" -eq 0
            test "$network_status" -eq 1
            printf 'Restricted-host evidence: required refusal + explicit disabled; NOT network enforcement\n'
          elif test "$user_status" -ne 0 || test "$network_status" -ne 0; then
            exit 1
          fi

  # Bounded owner-approved #9 experiment, not adoption or app packaging.
  # Run once per task-branch push, not twice through pull_request events.
  native-candidate-loader:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/user/issue-9-real-file-transcription' }}
    name: Experimental arm64 native speech (not adoption)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prepare pinned native candidate without implicit downloads
        run: bash tests/prepare_macos_candidate.sh
      - name: Relocated Required loader, missing-helper/library controls, restoration
        env:
          HAGIG_NATIVE_BOOTSTRAP: ${{ runner.temp }}/hagig-issue9-native/Contents/Helpers/hagig-worker
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hagig-issue9-native"
          cargo test --locked --test native_loader -- --ignored --nocapture 2>&1 | tee "$root/evidence/loader-before.txt"
          helper="$root/Contents/Helpers/hagig-inference-worker"
          libraries="$root/Contents/Frameworks"
          trap 'if test -f "$helper.absent"; then mv "$helper.absent" "$helper"; fi; if test -d "$libraries.absent"; then mv "$libraries.absent" "$libraries"; fi' EXIT
          mv "$helper" "$helper.absent"
          if cargo test --offline --locked --test native_loader -- --ignored --nocapture > "$root/evidence/loader-missing.txt" 2>&1; then
            printf 'Missing native helper unexpectedly passed\n' >&2
            exit 1
          fi
          grep -F 'native reply required after bootstrap ACK' "$root/evidence/loader-missing.txt"
          mv "$helper.absent" "$helper"
          mv "$libraries" "$libraries.absent"
          if cargo test --offline --locked --test native_loader -- --ignored --nocapture > "$root/evidence/loader-no-libraries.txt" 2>&1; then
            printf 'Missing native libraries unexpectedly passed\n' >&2
            exit 1
          fi
          grep -F 'native reply required after bootstrap ACK' "$root/evidence/loader-no-libraries.txt"
          mv "$libraries.absent" "$libraries"
          cargo test --offline --locked --test native_loader -- --ignored --nocapture 2>&1 | tee "$root/evidence/loader-restored.txt"
      - name: Explicit pinned model install and real speech lifecycle with zero-PCM control
        run: bash tests/exercise_macos_candidate.sh
      - name: Dispose acquired assets and temporary binaries
        if: ${{ always() }}
        run: |
          root="$RUNNER_TEMP/hagig-issue9-native"
          if test -d "$root/mutant-source"; then git worktree remove --force "$root/mutant-source"; fi
          rm -rf "$root/data" "$root/Contents" "$root/libraries" "$root/target" "$root/mutant-target"
          rm -f "$root/native.tar.bz2"
          test ! -e "$root/data"
          test ! -e "$root/native.tar.bz2"
      - name: Upload sanitized synthetic evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue9-native-speech-${{ github.sha }}
          path: ${{ runner.temp }}/hagig-issue9-native/evidence/
          if-no-files-found: error
          retention-days: 7
