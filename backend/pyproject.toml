[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hagig"
version = "0.1.0"
description = "Privacy-first local voice-to-text server, worker and CLI"
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
authors = [
    { name = "mattjmcnaughton", email = "me@mattjmcnaughton.com" },
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "structlog>=24.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "numpy>=2.0",
    "httpx>=0.27",
]

# Inference engines (TDD section 2), installed only where they run: the
# worker and `hagig model install` (MLX conversion). The server, CLI and the
# portable tests need neither. The app bundle syncs both extras.
[project.optional-dependencies]
qwen3-asr = [
    "transformers==5.22.2",
    "torch==2.15.0",
]
mlx-whisper = [
    "mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
hagig = "hagig.cli:app"
hagig-worker = "hagig.worker:main"

[project.urls]
Repository = "https://github.com/mattjmcnaughton/hagig"

# Installed environments, such as the app bundle, carry the Seatbelt profile
# inside the package; launcher.py looks there first and falls back to
# src/launcher/ in a checkout. (Editable builds also copy it to an inert
# site-packages/hagig/ directory, which the real package in src/ shadows.)
[tool.hatch.build.targets.wheel.force-include]
"src/launcher/seatbelt-v1.sb" = "hagig/seatbelt-v1.sb"

[tool.uv]
exclude-newer = "1 week"
# The pinned transformers 5.22.2 (published 2026-11-06) is newer than the cutoff.
exclude-newer-package = { transformers = "2026-11-07T00:00:00Z" }

# Linux takes PyTorch's CPU-only wheels (owner-approved index); macOS uses PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "ty>=0.0.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The engine stacks are extras (macOS and the bundle), not in the portable
# environment ty checks; their imports stay inside the engine modules.
[tool.ty.analysis]
allowed-unresolved-imports = ["torch", "transformers", "transformers.**", "mlx", "mlx.**", "mlx_whisper", "mlx_whisper.**"]
