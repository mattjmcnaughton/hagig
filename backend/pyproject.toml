[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hagig"
version = "0.1.0"
description = "Privacy-first local voice-to-text server, worker and CLI"
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
authors = [
    { name = "mattjmcnaughton", email = "me@mattjmcnaughton.com" },
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "structlog>=24.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "numpy>=2.0",
    "httpx>=0.27",
]

[project.scripts]
hagig = "hagig.cli:app"
hagig-worker = "hagig.worker:main"

[project.urls]
Repository = "https://github.com/mattjmcnaughton/hagig"

[tool.uv]
exclude-newer = "1 week"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "ty>=0.0.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
