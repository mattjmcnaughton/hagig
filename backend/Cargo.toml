[package]
name = "hagig"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs", "process", "thread", "event"] }

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "=1.1.6", default-features = false, features = ["std", "event", "process"] }
libc = { version = "=0.2.191", default-features = false }
